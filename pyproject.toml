[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mutant-rag"
version = "0.1.0"
description = "Historical bug-based mutation testing RAG for Bitcoin Core"
requires-python = ">=3.10"
dependencies = ["sentence-transformers>=2.6", "faiss-cpu>=1.7.4", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["mutant_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Claude Code CLI (set MUTANT_RAG_LIVE=1)",
    "model: downloads/loads a sentence-transformers model (set MUTANT_RAG_MODEL_TESTS=1)",
]
